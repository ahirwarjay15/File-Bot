name: Oracle Auto Deploy

on:
  push:
    branches:
      - blueprint-implementation-pass-2026-10-11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify code before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app main.py tests
      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to Oracle Cloud
    needs: test
    if: ${{ vars.ORACLE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy tested commit
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -eu
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          ssh -i ~/.ssh/oracle_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" 'set -eu; cd /home/ubuntu/File-Bot; git fetch origin blueprint-implementation-pass-2026-10-11; git reset --hard origin/blueprint-implementation-pass-2026-10-11; if grep -q "^SOURCE_CHANNEL_ID=" .env; then sed -i "s/^SOURCE_CHANNEL_ID=.*/SOURCE_CHANNEL_ID=-1004430375220/" .env; else printf "\\nSOURCE_CHANNEL_ID=-1004430375220\\n" >> .env; fi; .venv/bin/pip install -r requirements.txt; .venv/bin/python -m compileall -q app main.py; sudo -n systemctl restart file-bot; sudo -n systemctl is-active --quiet file-bot'
