name: Oracle Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify code before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app main.py tests
      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to Oracle Cloud
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && vars.ORACLE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy tested commit
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          ssh -i ~/.ssh/oracle_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" "GITHUB_SHA='$GITHUB_SHA' sh -s" <<'REMOTE'
          set -eu
          case "$GITHUB_SHA" in *[!0-9a-f]*|'') echo "Invalid deployment commit SHA" >&2; exit 1 ;; esac
          cd /home/ubuntu/File-Bot
          git fetch origin "$GITHUB_SHA"
          git reset --hard "$GITHUB_SHA"
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m compileall -q app main.py
          sudo -n systemctl restart file-bot
          sudo -n systemctl is-active --quiet file-bot
          REMOTE
